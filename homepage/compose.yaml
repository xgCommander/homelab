networks:
  default:
    name: tk-proxy
    external: true
  socket-proxy:
    name: socket-proxy
    external: true

services:
  homepage:
    container_name: homepage
    environment:
      HOMEPAGE_ALLOWED_HOSTS: homepage.local.xerogravity.space
      PGID: 996
      PUID: 1000
    image: ghcr.io/gethomepage/homepage:latest
    labels:
      traefik.enable: true
      traefik.http.routers.homepage.entrypoints: https
      traefik.http.routers.homepage.rule: Host(`homepage.local.xerogravity.space`)
      traefik.http.routers.homepage.service: homepage
      traefik.http.routers.homepage.tls: true
      traefik.http.services.homepage.loadbalancer.server.port: 3000
    networks:
    - default
    - socket-proxy
    restart: unless-stopped
    volumes:
    - type: bind
      source: ./container_data/homepage/config
      target: /app/config
      read_only: false
    - type: bind
      source: ./container_data/homepage/icons
      target: /app/public/icons
      read_only: false
    - type: bind
      source: ./container_data/homepage/images
      target: /app/public/images
      read_only: false
    - type: bind
      source: /mnt/void
      target: /mnt/void
      read_only: true
